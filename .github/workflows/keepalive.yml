# Supabase（無料プラン）が一時停止しないよう、週2回アクセスする
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --max-time 30 \
            -H "apikey: sb_publishable_TXzoU5wRIVpy1kMDz5BOKg_xSXhMDIh" \
            "https://ddedokhhgwqdmhuxxnns.supabase.co/rest/v1/progress?select=user_id&limit=1" || \
          curl -fsS --retry 3 --max-time 30 "https://ddedokhhgwqdmhuxxnns.supabase.co/auth/v1/health" -H "apikey: sb_publishable_TXzoU5wRIVpy1kMDz5BOKg_xSXhMDIh"
